[package]
name = "plumed-relay"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "HTTPS relay and phone page of the Plumed remote microphone"
publish = false

[dependencies]
plumed-relay-protocol = { path = "../protocol" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
base64 = "0.22"
getrandom = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["test-util"] }
