name: build-linux-ubuntu-24
on:
    workflow_dispatch:
        inputs:
            dry:
                default: true
                description: Prevent signing and upload
                required: false
                type: boolean

permissions:
    contents: read

jobs:
    build-linux:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: lts/*

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable branch (2025-12-16), the toolchain input picks the version

            - uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
              with:
                  workspaces: './src-tauri -> target'
                  key: 'ubuntu-24-fresh'

            - name: Install pnpm
              run: npm install -g pnpm@10.19.0 --ignore-scripts

            - name: Install Linux deps (official + extras)
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev \
                    librsvg2-bin \
                    patchelf \
                    libasound2-dev \
                    libxdo-dev \
                    build-essential \
                    pkg-config \
                    libssl-dev \
                    libgtk-3-dev \
                    unzip

            - name: Download & extract ONNX model (Linux)
              shell: bash
              run: bash scripts/fetch-ultimed-model.sh

            - name: Install frontend deps
              run: pnpm install --ignore-scripts

            - name: Build (AppImage)
              env:
                  PLUMED_TELEMETRY_WEBSITE_ID: ${{ secrets.PLUMED_TELEMETRY_WEBSITE_ID }}
                  PLUMED_RULES_PUBKEY: ${{ secrets.PLUMED_RULES_PUBKEY }}
              run: pnpm tauri build --bundles appimage

            - name: Restore Tauri signing key
              if: ${{ inputs.dry == false }}
              env:
                  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
              run: echo "$TAURI_PRIVATE_KEY" | base64 -d > tauri.key

            - name: Sign AppImage(s) with Tauri signer
              if: ${{ inputs.dry == false }}
              env:
                  TAURI_PRIVATE_KEY_PATH: tauri.key
                  TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
              shell: bash
              run: |
                  files=$(find src-tauri/target/release/bundle -type f -name "*.AppImage")
                  if [ -n "$files" ]; then
                    pnpm tauri signer sign $files
                  else
                    echo "No AppImage found to sign."
                  fi

            - name: Rename AppImage files to remove version and add architecture
              if: ${{ inputs.dry == false }}
              shell: bash
              run: |
                  find src-tauri/target/release/bundle -name "*.AppImage" -exec sh -c 'mv "$1" "$(dirname "$1")/Plumed_amd64.AppImage"' _ {} \;
                  find src-tauri/target/release/bundle -name "*.sig" -exec sh -c 'mv "$1" "$(dirname "$1")/Plumed_amd64.AppImage.sig"' _ {} \;

            - name: Upload artifact (1 day)
              if: ${{ inputs.dry == false }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: plumed-linux
                  path: |
                      src-tauri/target/release/bundle/**/*.AppImage
                      src-tauri/target/release/bundle/**/*.sig
                  retention-days: 1
