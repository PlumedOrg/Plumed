name: CI
on:
    pull_request:

jobs:
    check-guidelines:
        name: Check Guidelines
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: lts/*

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable branch (2025-12-16), the toolchain input picks the version

            - uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
              with:
                  workspaces: './src-tauri -> target'

            - name: Install pnpm
              run: npm install -g pnpm@10.19.0 --ignore-scripts

            - name: Install Linux deps (official + extras)
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    libasound2-dev \
                    libxdo-dev \
                    unzip \
                    build-essential \
                    curl \
                    wget \
                    file \
                    libssl-dev

            - name: Download & extract ONNX model (Linux)
              shell: bash
              run: bash scripts/fetch-ultimed-model.sh

            - name: Download Grammalecte (grammar step)
              shell: bash
              run: bash scripts/fetch-grammalecte.sh

            - name: Install frontend deps
              run: pnpm install --ignore-scripts

            - name: Clippy
              run: pnpm run clippy

            - name: Lint
              run: pnpm run lint

    compile-linux:
        uses: ./.github/workflows/build-linux.yml
        with:
            dry: true

    compile-windows:
        uses: ./.github/workflows/build-windows.yml
        with:
            dry: true

    compile-macos:
        uses: ./.github/workflows/build-macos.yml
        with:
            dry: true
